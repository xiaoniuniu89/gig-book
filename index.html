<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gig Book</title>
<meta name="description" content="Setlists from iReal Pro with analysed chord charts, a built-in backing band and Spotify recordings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238C5F0E'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-docksize="full">
<header class="bar-top">
  <div class="bar-top-inner">
    <a class="brand" href="#home">Gig<span>Book</span></a>
    <div class="crumb" id="crumb"></div>
    <a class="btn small" href="#library">Library</a>
  </div>
</header>
<main><div class="wrap" id="view"><p class="hint">Loading…</p></div></main>

<div id="toast" role="status" hidden></div>

<section id="dock" aria-label="Player">
  <div class="dock-inner">
    <div class="dock-bar">
      <span class="seg" role="group" aria-label="Sound source">
        <button data-dock="band" aria-pressed="true">Band</button>
        <button data-dock="record" aria-pressed="false">Record</button>
      </span>
      <span class="dock-status" id="band-status">Ready</span>
      <button class="btn small" id="dock-size">Hide</button>
    </div>
    <div class="dock-body">
      <div class="pane-band">
        <button class="btn primary" id="band-play">▶ Play</button>
        <div class="band-main">
          <span class="t" id="band-title">Open a tune to play it with the band</span>
          <div class="band-ctrls">
            <label for="band-tempo">Tempo <input id="band-tempo" type="range" min="40" max="320" step="2" value="140"> <b id="tempo-val">140</b></label>
            <label for="band-choruses">Choruses
              <select id="band-choruses"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="6">6</option></select>
            </label>
            <label for="band-loop"><select id="band-loop"><option value="">Whole tune</option></select></label>
            <label for="band-countin"><input id="band-countin" type="checkbox" checked> Count-in</label>
            <span class="chips" role="group" aria-label="Instruments">
              <button class="chip" id="mute-piano" aria-pressed="true">Piano</button>
              <button class="chip" id="mute-bass" aria-pressed="true">Bass</button>
              <button class="chip" id="mute-drums" aria-pressed="true">Drums</button>
            </span>
          </div>
        </div>
      </div>
      <div class="pane-record">
        <div class="rec-head">
          <b id="rec-title">Spotify</b>
          <button class="btn small" id="rec-load">Load this setlist's playlist</button>
          <label class="toggle" for="rec-follow"><input id="rec-follow" type="checkbox" checked> Charts follow the music</label>
          <span class="hint" id="rec-status"></span>
        </div>
        <div id="sp-embed"></div>
      </div>
    </div>
  </div>
</section>
<script type="module" src="js/app.js"></script>
</body>
</html>
